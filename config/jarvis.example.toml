# JARVIS configuration — copy to config/jarvis.toml and edit.
# config/jarvis.toml is git-ignored. Never put secrets in this file:
# API keys and tokens go in environment variables or the local .env file.
#
# Settings you change in the app's Settings panel are stored in data/settings.json
# and take precedence over the same setting here. Switch a setting back in the
# panel to hand control back to this file.

assistant_name = "JARVIS"
language = "auto"              # "auto" (reply in the user's language), "sv" or "en"

[server]
host = "127.0.0.1"             # loopback only
port = 8765
open_browser = true

# ---------------------------------------------------------------- AI ----
[ai]
allow_dev_fallback = true      # rule-based stand-in when no model is reachable (always labelled)
monthly_budget_usd = 10.0      # cloud calls pause when the estimated monthly cost reaches this
request_timeout_s = 60
max_tool_rounds = 6

# Each task category tries providers in order. Categories are chosen locally
# by keywords, so routing never costs a model call.
# effort: low | medium | high — lower effort means fewer tokens and lower cost.
[[ai.routes.conversation]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"
[[ai.routes.conversation]]
provider = "ollama"
[[ai.routes.conversation]]
provider = "dev"

[[ai.routes.smart_home]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"
# Cheaper alternative for simple device commands — uncomment to try:
# model = "claude-haiku-5-5"
[[ai.routes.smart_home]]
provider = "ollama"
[[ai.routes.smart_home]]
provider = "dev"

[[ai.routes.computer]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"
[[ai.routes.computer]]
provider = "ollama"
[[ai.routes.computer]]
provider = "dev"

[anthropic]
enabled = true
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 16000
server_side_fallback = true    # retry refused requests on a fallback model server-side

[ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"           # small, tool-capable; try "qwen2.5:7b" on a machine with 16 GB+ RAM
keep_alive = "10m"             # how long the model stays in GPU memory after the last request
num_ctx = 8192                 # context window; too small and Ollama silently forgets the start
temperature = 0.2              # lower = more consistent tool use
num_predict = 1024             # max tokens per reply; stops a stuck model from blocking the GPU

# ---------------------------------------------------- Home Assistant ----
[homeassistant]
enabled = true
dry_run = true                 # simulate speaker actions; set false once you trust what JARVIS would do
# url = "http://homeassistant.local:8123"
token_env = "HA_TOKEN"
verify_ssl = true
timeout_s = 10
# tts_entity = "tts.piper"     # auto-detected when unset
max_volume_without_confirmation = 60

# ---------------------------------------------------- Computer control ----
[computer]
# Actions on the PC happen for real (dry_run = true only describes them).
dry_run = false
# Advanced mode: JARVIS may propose a PowerShell command. It shows the exact command
# and you approve every run. Can also be toggled in Settings.
advanced_mode = false
# enabled: omit for automatic (on for Windows, off on Linux / Raspberry Pi)
# enabled = true

[computer.allowed_apps.notepad]
command = ["notepad.exe"]
description = "Notepad"

[computer.allowed_apps.calculator]
command = ["calc.exe"]
description = "Calculator"

[computer.allowed_apps.explorer]
command = ["explorer.exe"]
description = "File Explorer"

# [computer.allowed_apps.spotify]
# command = ["C:\\Users\\YOU\\AppData\\Roaming\\Spotify\\Spotify.exe"]
# description = "Spotify"

# --------------------------------------------------------- Monitoring ----
# Background monitoring and notifications. What is important, quiet hours and
# the morning summary time are in config/rules.toml.
[monitoring]
enabled = true
retention_days = 14              # how long JARVIS remembers what it already notified (hashes + times only)
# windows_notifications = true   # omit for automatic (on Windows)

# --------------------------------------------------------------- Mail ----
# Gmail, READ-ONLY (gmail.readonly). Sign in once with:
#   .\.venv\Scripts\python.exe -m jarvis mail-login --client-secret C:\path\client_secret.json
# The token is stored in Windows Credential Manager, never in a file.
# What is important is decided by config/rules.toml first; other mail is
# classified by the LOCAL Ollama model only (never a cloud model), with no tools.
[mail]
enabled = true
poll_minutes = 15
max_per_poll = 20
initial_lookback_hours = 12      # how far back the first check after start looks
query = "in:inbox"               # Gmail search filter, e.g. "in:inbox -category:promotions"

# -------------------------------------------------------------- Files ----
# Watched folders. JARVIS indexes ONLY metadata (name, path, type, size, modified
# time) and never reads file contents. Secret-looking files (.env, *.key, *.pem,
# *.pfx, *.kdbx, *.ovpn, id_rsa*, password files), the folders .ssh/.git/
# node_modules/AppData, hidden/system files and links/junctions are skipped.
# The index lives in data/files.db. Important file names are set in rules.toml [files].
[files]
enabled = true
# "known:Downloads" and "known:Documents" follow the Windows Known Folders
# (Hämtade filer, Dokument), wherever they are. Other entries are folder paths.
watched_folders = ["known:Downloads", "known:Documents"]
max_depth = 8
max_files = 50000
refresh_minutes = 15

# ------------------------------------------------------------ Gaming ----
# Game mode: while one of these programs runs, or the GPU stays above the
# threshold, JARVIS makes no background calls to the local model and unloads
# it from the GPU. Mail that needs the model waits until the game closes;
# mail matching your rules is still notified at once. Local and free.
[gaming]
enabled = true
process_names = ["cs2.exe"]      # add more, e.g. "valorant.exe", "eldenring.exe"
gpu_threshold_percent = 85       # 100 = only the process list
gpu_high_minutes = 2

# ------------------------------------------------------------ Privacy ----
[privacy]
local_only = false
cloud_max_sensitivity = "normal"   # "normal" or "personal"
microphone_enabled = false
camera_enabled = false

[retention]
max_conversation_messages = 60
tool_history_size = 200

[logging]
level = "INFO"
to_file = true
log_conversation_content = false

# ----------------------------------------------------------- Profiles ----
# Roles: owner, adult, child, guest. Phase 1 does not verify identity.
default_profile = "owner"

[[profiles]]
id = "owner"
name = "Owner"
role = "owner"

